version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: documind-db
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind_secret
      POSTGRES_DB: documind_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: documind-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://documind:documind_secret@db:5432/documind_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: documind-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
